<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 768" role="img" aria-labelledby="title desc">
<title id="title">LAKSHYA mountain travel logo</title><desc id="desc">A wide transparent logo with a glowing golden sunrise, dramatic snow mountains, dark pine forest and gold LAKSHYA lettering.</desc>
<defs>
 <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffdf0"/><stop offset=".45" stop-color="#b9d1d9"/><stop offset="1" stop-color="#174052"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff4c4"/><stop offset=".38" stop-color="#ffd36a"/><stop offset=".72" stop-color="#d99128"/><stop offset="1" stop-color="#8c4c16"/></linearGradient>
 <linearGradient id="pine" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#174b50"/><stop offset="1" stop-color="#061d2b"/></linearGradient>
 <radialGradient id="sun"><stop stop-color="#fff5bd"/><stop offset=".65" stop-color="#ffbd39"/><stop offset="1" stop-color="#ed7b1d" stop-opacity="0"/></radialGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="16"/></filter>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur in="SourceAlpha" stdDeviation="8"/><feOffset dy="10"/><feComponentTransfer><feFuncA type="linear" slope=".85"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
